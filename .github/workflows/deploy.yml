name: Deploy til Supabase
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno task check
      - run: deno task test
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Test Shopify Validation Function
        working-directory: shopify-app
        run: node --test "extensions/parti-validering/test/*.test.mjs"
      - name: Bygg dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: zesaeleooiptrpjzqhxe
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref $PROJECT_REF
      - run: supabase db push
      - run: supabase functions deploy --project-ref $PROJECT_REF
