<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5F0B09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garnly">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Garnly butikkpanel</title>
</head>
<body>

<!-- Innlogging -->
<section id="login" class="login" hidden>
  <form id="login-form" class="login__card">
    <h1>Garnly</h1>
    <p class="login__sub">Butikkpanel</p>
    <label>E-post
      <input type="email" name="email" autocomplete="username" required autocapitalize="none" spellcheck="false">
    </label>
    <label>Passord
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn--primary btn--block">Logg inn</button>
    <p id="login-error" class="login__error" role="alert" hidden></p>
  </form>
</section>

<!-- Panel -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar__left">
      <span class="logo">Garnly</span>
      <select id="store-switch" class="store-switch" hidden aria-label="Velg butikk"></select>
      <span id="store-name" class="store-name"></span>
    </div>
    <div class="topbar__stats">
      <span class="stat"><b id="stat-queue">0</b> nye</span>
      <span class="stat"><b id="stat-pack">0</b> å pakke</span>
      <span class="stat stat--muted"><b id="stat-today">0</b> i dag</span>
    </div>
    <div class="topbar__right">
      <span id="conn" class="conn" title="Tilkobling">●</span>
      <button id="sound-toggle" class="btn btn--ghost" aria-pressed="true" title="Lyd av eller på">🔔</button>
      <button id="logout" class="btn btn--ghost">Logg ut</button>
    </div>
  </header>

  <main class="cols">
    <section class="col">
      <h2 class="col__title">
        Nye ordrer
        <button id="accept-all" class="btn btn--primary btn--sm" hidden>Godta alle</button>
      </h2>
      <div id="queue" class="cards"></div>
      <p id="queue-empty" class="empty" hidden>Ingen nye ordrer akkurat nå.<br><span>Panelet varsler av seg selv når det kommer en.</span></p>
    </section>

    <section class="col">
      <h2 class="col__title">Til pakking</h2>
      <div id="assigned" class="cards"></div>
      <p id="assigned-empty" class="empty" hidden>Ingenting venter på pakking.</p>
    </section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
