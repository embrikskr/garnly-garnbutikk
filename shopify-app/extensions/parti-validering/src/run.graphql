query RunInput {
  localization {
    country {
      isoCode
    }
  }
  cart {
    deliveryGroups {
      deliveryAddress {
        countryCode
      }
    }
    lines {
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            title
          }
          metafield(namespace: "garnly", key: "stock_by_store") {
            value
          }
        }
      }
    }
  }
}
